# =============================================================
# Docker Compose — VUC-Fyn Semesterprojekt
#
# Kræver en .env-fil i roden med følgende variabler:
#   DB_PASSWORD       — SQL Server SA-adgangskode
#   GRAFANA_PASSWORD  — Grafana admin-adgangskode
#
# Se .env.example for et skabelon.
# =============================================================

services:

  # ── API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Overskriver connection string fra appsettings.json
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=VucFyn;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      db:
        # API starter ikke før databasen er healthy
        condition: service_healthy
    networks:
      - app-net
      - monitoring-net

  # ── SQL Server ───────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      # sqlcmd er placeret i mssql-tools18 i SQL Server 2022-imaget
      # -C angiver at server-certifikatet skal stoles på (self-signed)
      # -b afslutter med fejlkode hvis SELECT fejler
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -C"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-net

  # ── Node Exporter (host-metrics) ─────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.9.1
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      # Ekskludér virtuelle og system-mount-points fra disk-metrics
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring-net

  # ── cAdvisor (container-metrics) ─────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    ports:
      - "8081:8080"   # Eksternt 8081 for at undgå kollision med API på 8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net

  # ── Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.5
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - monitoring-net
      - app-net   # Skal nå api-servicen for at scrape /metrics

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-net

  # ── Loki (log-aggregering) ────────────────────────────────
  loki:
    image: grafana/loki:3.4.3
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - monitoring-net

  # ── Promtail (log-indsamler) ──────────────────────────────
  promtail:
    image: grafana/promtail:3.4.3
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker socket bruges til automatisk service-discovery af containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Adgang til container-log-filer på hosten
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - monitoring-net

# ── Netværk ───────────────────────────────────────────────────
networks:
  app-net:       # API og database
  monitoring-net: # Observability-stakken

# ── Persistente volumes ────────────────────────────────────────
volumes:
  sql_data:       # SQL Server data
  prometheus_data: # Prometheus tidsserier
  grafana_data:   # Grafana dashboards og brugere
  loki_data:      # Loki log-chunks
