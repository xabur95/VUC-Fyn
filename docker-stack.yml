# Author: Michael
#
# Centrale forskelle fra docker-compose.yml:
#   - Swarm kan ikke bygge images (ingen 'build:' blok) — image skal være færdigt og tilgængeligt
#   - .env erstattes af Docker Secrets (/run/secrets/...) — krypteret opbevaring i Swarm
#   - 'deploy:'-blok aktiveres kun af Swarm (ignoreres af docker compose up)
#   - Netværk bruger 'overlay'-driver til multi-host kommunikation
#   - 'replicas: 2' på API — Swarm sørger for load balancing og self-healing
#  
# Deploy med:
#   docker swarm init
#   docker stack deploy -c docker-stack.yml vucfyn
#   docker stack services vucfyn  

version: "3.8"
services:
  api:
    # Swarm kan ikke bygge — image publiceres til registry først
    image: vuc-fyn-api:latest  
    ports:
      - "5000:8080"
    # Password læses fra /run/secrets/ — ikke .env
    secrets:
      - db_password
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_SECRET_PATH: /run/secrets/db_password            
    deploy:
      # 2 replicas — load balancing + self-healing
      replicas: 2               
      update_config:
        # Rolling update: opdatér én instans ad gangen
        parallelism: 1  
        # Default er pause — vi sætter eksplicit rollback
        delay: 10s     
        failure_action: rollback 
      restart_policy:
         # Self-healing: genstart ved fejl
        condition: on-failure  
    networks:
      - app-net
      - monitoring-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - sql_data:/var/opt/mssql
    deploy:
      replicas: 1
      placement:
        constraints:
        # Database kører kun på manager-noden for datakonsistens
          - node.role == manager  
    networks:
      - app-net

secrets:
  db_password:
    # Krypteret i Swarm — oprettes med:
    # echo "password" | docker secret create db_password -
    external: true

networks:
  app-net:
  # Overlay: netværket spænder på tværs af Swarm-noder
    driver: overlay             
  monitoring-net:
    driver: overlay

volumes:
  sql_data: