# =============================================================
# Prometheus scrape-konfiguration
#
# Prometheus poller disse targets hvert 15. sekund og gemmer
# metrikker som tidsserier i sin lokale TSDB.
# =============================================================

global:
  scrape_interval: 15s      # Hvor ofte der indsamles metrikker
  evaluation_interval: 15s  # Hvor ofte alert-regler evalueres

scrape_configs:

  # API — eksponerer /metrics via prometheus-net.AspNetCore
  - job_name: api
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics

  # Node Exporter — CPU, RAM, disk og netværk på host-maskinen
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor — ressourceforbrug per Docker-container
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
